name: Fase 6 dependency bootstrap

on:
  push:
    branches:
      - feat/mobile-store-packaging-eas

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-store-packaging-eas

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Align Expo 57 packaging dependencies
        run: npx expo install expo@~57.0.20 expo-font expo-splash-screen

      - name: Commit dependency alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependencies already aligned."
            exit 0
          fi
          git commit -m "chore(mobile): align Expo 57 native packaging dependencies"
          git push origin HEAD:feat/mobile-store-packaging-eas
