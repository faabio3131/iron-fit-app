name: Mobile + Web CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'feat/**'
      - 'fix/**'
      - 'stabilization/**'
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://example.invalid/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high severity gate)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Release readiness
        run: npm run release:check

      - name: Build verification
        run: npm run build:check

      - name: Export Android production bundle
        env:
          NODE_ENV: production
        run: |
          rm -rf dist expo-export.log
          npx expo export --platform android --output-dir dist 2>&1 | tee expo-export.log

      - name: Verify Android production bundle integrity
        run: |
          test -s dist/metadata.json
          BUNDLE="$(find dist/_expo/static/js/android -type f -name '*.hbc' -size +100k -print -quit)"
          test -n "$BUNDLE"
          grep -q 'Ionicons.ttf' expo-export.log
          grep -q 'Android Bundled' expo-export.log
          if grep -Eqi 'Unable to resolve|Cannot find module|Module not found|error:.*asset' expo-export.log; then
            echo 'Critical module/asset resolution error found in Android production export.'
            exit 1
          fi
          if strings "$BUNDLE" | grep -E '@testing-library/react-native|jest-expo|eslint-config-expo|__tests__/' ; then
            echo 'Development/test-only module marker found in Android production bundle.'
            exit 1
          fi
          echo "Certified Android production bundle: $BUNDLE"

      - name: Export iOS production bundle
        env:
          NODE_ENV: production
        run: |
          rm -rf dist-ios expo-ios-export.log
          npx expo export --platform ios --output-dir dist-ios 2>&1 | tee expo-ios-export.log

      - name: Verify iOS production bundle integrity
        run: |
          test -s dist-ios/metadata.json
          BUNDLE="$(find dist-ios/_expo/static/js/ios -type f \( -name '*.hbc' -o -name '*.js' \) -size +100k -print -quit)"
          test -n "$BUNDLE"
          grep -q 'Ionicons.ttf' expo-ios-export.log
          grep -q 'iOS Bundled' expo-ios-export.log
          if grep -Eqi 'Unable to resolve|Cannot find module|Module not found|error:.*asset' expo-ios-export.log; then
            echo 'Critical module/asset resolution error found in iOS production export.'
            exit 1
          fi
          if strings "$BUNDLE" | grep -E '@testing-library/react-native|jest-expo|eslint-config-expo|__tests__/' ; then
            echo 'Development/test-only module marker found in iOS production bundle.'
            exit 1
          fi
          echo "Certified iOS production bundle: $BUNDLE"

      - name: Export Web production bundle
        env:
          NODE_ENV: production
        run: |
          rm -rf dist-web expo-web-export.log
          npx expo export --platform web --output-dir dist-web 2>&1 | tee expo-web-export.log

      - name: Verify Web production bundle integrity
        run: |
          test -s dist-web/index.html
          find dist-web -type f -name '*.js' -size +20k -print -quit | grep -q .
          grep -q 'Web Bundled' expo-web-export.log
          if grep -Eqi 'Unable to resolve|Cannot find module|Module not found|error:.*asset' expo-web-export.log; then
            echo 'Critical module/asset resolution error found in Web production export.'
            exit 1
          fi
          echo 'Certified Web production export.'

      - name: Build production Web container image
        run: |
          docker build --pull \
            -f Dockerfile.web \
            --build-arg EXPO_PUBLIC_API_URL=https://example.invalid/api/v1 \
            -t iron-fit-web-ci:${{ github.sha }} .

      - name: Start Web container and verify health/static export
        run: |
          CID="$(docker run -d -p 18080:3000 iron-fit-web-ci:${{ github.sha }})"
          trap 'docker logs "$CID" || true; docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/tmp/iron-web-health.json; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = "1"
          grep -q '"status":"ok"' /tmp/iron-web-health.json
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<!DOCTYPE html'
