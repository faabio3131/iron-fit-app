name: Mobile CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://example.invalid/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Release readiness
        run: npm run release:check
