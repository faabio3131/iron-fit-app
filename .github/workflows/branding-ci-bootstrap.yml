name: Iron Fit Branding and CI Bootstrap

on:
  push:
    branches:
      - refactor/iron-fit-branding-and-modular-architecture

permissions:
  contents: write

jobs:
  migrate-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://example.invalid/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install baseline dependencies
        run: npm ci

      - name: Apply canonical Iron Fit branding and quality configuration
        run: node scripts/apply-iron-fit-branding-ci.mjs

      - name: Resolve React 19 lint debt
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'App.tsx';
          let app = fs.readFileSync(path, 'utf8');
          const before = `  useEffect(() => {\n    if (token) {\n      api('/me/profile', token).then(setProfile).catch(() => null);\n    } else {\n      setProfile(null);\n    }\n  }, [token]);`;
          const after = `  useEffect(() => {\n    if (!token) return;\n\n    let cancelled = false;\n    api('/me/profile', token)\n      .then((nextProfile) => {\n        if (!cancelled) setProfile(nextProfile);\n      })\n      .catch(() => null);\n\n    return () => {\n      cancelled = true;\n    };\n  }, [token]);`;
          if (!app.includes(before)) throw new Error('Expected profile effect not found.');
          app = app.replace(before, after);
          fs.writeFileSync(path, app);

          const testPath = 'test/app-branding.test.tsx';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace("\nimport App from '../App';", "\n// eslint-disable-next-line import/first\nimport App from '../App';");
          fs.writeFileSync(testPath, test);
          NODE

      - name: Install Expo-compatible test and lint toolchain
        run: |
          npx expo install --dev jest jest-expo @types/jest eslint eslint-config-expo
          npm install --save-dev @testing-library/react-native@13.3.3 react-test-renderer@19.2.3 @types/node

      - name: Verify deterministic lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Jest tests
        run: npm test

      - name: Reject legacy mobile brand identifiers
        shell: bash
        run: |
          if grep -R -n -E 'IronCloud|com\.ironcloud|"ironcloud"|gym-saas-app' App.tsx app.json package.json src; then
            echo 'Legacy IronCloud identity detected in executable/configuration source.'
            exit 1
          fi

      - name: Commit certified branding and CI candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/branding-ci-bootstrap.yml scripts/apply-iron-fit-branding-ci.mjs
          git add -A
          git commit -m 'refactor(mobile): align Iron Fit branding and quality gates'
          git push origin HEAD:refactor/iron-fit-branding-and-modular-architecture
