[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"
watchPatterns = ["src/**", "scripts/**", "package.json", "package-lock.json", "Dockerfile.web", "railway.toml"]

[deploy]
startCommand = "node scripts/serve-web.mjs"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
